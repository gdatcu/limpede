name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Prepare Environment File
        run: cp .env.example .env

      - name: Run Build Runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run Automated Tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Limpede ${{ github.ref_name }}
          body: |
            ## 🚀 Limpede Release ${{ github.ref_name }}
            - Deterministic SRS language learning engine powered by Supabase.
            - On-demand Gemini AI grammar helper.
            - Download `app-release.apk` below to install or update Limpede on your Android device!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
