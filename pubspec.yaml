name: limpede
description: "A private, gamified AI learning app built with Flutter and Supabase."
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  supabase_flutter: ^2.3.4
  go_router: ^14.0.0
  freezed_annotation: ^2.4.1
  google_generative_ai: ^0.4.0
  envied: ^1.0.0
  json_annotation: ^4.8.1
  audioplayers: ^6.0.0
  http: ^1.2.0
  flutter_tts: ^4.0.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.5
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  riverpod_generator: ^2.4.0
  envied_generator: ^1.0.0
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icon/

